{{- /* Override of hugo-book's expand: identical markup, but every tag
at column 0 — the theme's 4-space-indented closing </div> is parsed by
goldmark as an indented code block whenever .Inner ends with a list,
leaking an unclosed div and nesting every following step card. */ -}}
<div class="book-expand">
<label>
<div class="book-expand-head flex justify-between">
<span>{{ default (i18n "Expand") (.Get 0) }}</span>
<span>{{ default "↕" (.Get 1) }}</span>
</div>
<input type="checkbox" class="hidden" />
<div class="book-expand-content markdown-inner">
{{ .Inner | markdownify }}
</div>
</label>
</div>
